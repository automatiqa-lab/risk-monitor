# EU AI Act Article 50 disclosure - Operations Risk Monitor
#
# Wording is canonical in the Automatiqa Lab disclosure skill (assets/wording.yaml).
# Change it there first, then propagate here on the next release. Do not edit the
# strings in code - every caller reads them from this file.
#
# Rule the strings obey: state THAT content is AI-generated, never WHICH model
# produced it. See COMPLIANCE.md for the classification and reasoning.

schema: automatiqa-disclosure/1
version: 1

# Product name that appears in the machine-readable envelope.
system: ops-risk-monitor

# Model identity is OFF by default across the lab. It is ON here.
#
# Reason: whoever runs Operations Risk Monitor picks the model themselves in
# config/settings.yaml under llm.model, so naming it discloses nothing the
# operator did not choose, and it makes a bad summary traceable to the model
# that wrote it during incident investigation.
#
# It goes into FILE METADATA ONLY - PDF info dictionary, XMP, PPTX core
# properties, HTML/Markdown front matter, JSON envelope. It never appears in
# visible page text. Article 50 requires disclosing that content is
# AI-generated, not which system produced it.
#
# Set include_model: false when you point llm.model at a local endpoint
# (ollama/...) and would rather not publish your local setup.
include_model: true
model: claude-sonnet-4-6

report:
  # Human-readable footer on any report that contains model-written prose.
  # Emitted only when at least one summary was actually written by the model.
  footer: >-
    The executive summary and the article summaries above were generated by AI from the linked
    sources. Headlines, figures and links are reproduced unmodified.
  # Per-item chip on a summary the model wrote.
  item_chip: "drafted by AI"
  # Per-item chip on text lifted straight from the source. Not AI output, and
  # marking it as such would be a false statement about provenance.
  source_chip: "source text"

deployer:
  notice: >-
    This output contains AI-generated content and carries machine-readable marking. If you
    redistribute it in the EU you are a deployer under the EU AI Act - keep the marking intact.

contact: aleks@automatiqa.io
